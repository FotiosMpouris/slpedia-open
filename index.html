<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SLP'edia</title>
  <meta name="description" content="A living encyclopedia of speech-language people, tools, and research — especially for autistic children." />
  <meta property="og:title" content="SLP'edia" />
  <meta property="og:description" content="A living encyclopedia of speech-language people, tools, and research — especially for autistic children." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Palette (exact): #1B1931 #44174E #662249 #A34054 #ED9E5B #E9BCB9 */
      --bg-0: #1B1931;
      --bg-1: #1B1931;
      --bg-2: #44174E;
      --ink-on-dark: #F7EDE9;
      --ink-on-light: #1B1931;
      --ink-muted-on-light: #44174E;
      --ink-faint-on-light: #662249;
      --cream: #E9BCB9;
      --cream-deep: #E0A8A4;
      --accent: #ED9E5B;
      --accent-rich: #F0AE72;
      --accent-deep: #D8893F;
      --accent-glow: rgba(237, 158, 91, 0.55);
      --rose: #A34054;
      --plum: #662249;
      --purple: #44174E;
      --ink: var(--ink-on-dark);
      --ink-muted: #E9BCB9;
      --ink-faint: rgba(233, 188, 185, 0.85);
      --surface: #E9BCB9;
      --surface-lift: #F3D4D1;
      --glass: #E9BCB9;
      --glass-border: rgba(237, 158, 91, 0.55);
      --border: #ED9E5B;
      --shadow: 0 8px 28px rgba(12, 8, 24, 0.45);
      --shadow-hover: 0 0 0 1px #ED9E5B, 0 0 36px rgba(237,158,91,0.35), 0 18px 44px rgba(12, 8, 24, 0.55);
      --radius: 18px;
      --radius-sm: 12px;
      --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      --font-ui: "Outfit", "Segoe UI", system-ui, sans-serif;
      --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      --yellow: var(--accent);
      --yellow-rich: var(--accent-rich);
      --yellow-deep: var(--accent-deep);
      --yellow-glow: var(--accent-glow);
      --cyan: #A34054;
      --cyan-soft: rgba(163, 64, 84, 0.18);
      --cyan-ink: #1B1931;
      --violet: #662249;
      --violet-soft: rgba(102, 34, 73, 0.32);
      --violet-ink: #1B1931;
      --coral: #A34054;
      --coral-soft: rgba(163, 64, 84, 0.2);
      --coral-ink: #1B1931;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink-on-dark);
      background:
        radial-gradient(ellipse 100% 60% at 50% -12%, rgba(237, 158, 91, 0.38) 0%, transparent 55%),
        radial-gradient(ellipse 55% 40% at 95% 15%, rgba(163, 64, 84, 0.28) 0%, transparent 50%),
        radial-gradient(ellipse 45% 35% at 5% 80%, rgba(68, 23, 78, 0.4) 0%, transparent 55%),
        var(--bg-0);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(237,158,91,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(237,158,91,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 20%, transparent 75%);
      opacity: 0.85;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 2.2rem 1.3rem 4rem;
    }

    header {
      margin-bottom: 1.7rem;
      position: relative;
      animation: heroIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes heroIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .brand-block {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }

    .logo-mark {
      flex: 0 0 auto;
      width: 68px;
      height: 68px;
      filter: drop-shadow(0 0 22px rgba(237, 158, 91, 0.65));
    }

    .brand-text { min-width: 0; flex: 1; }

    .brand-eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      font-family: var(--font-ui);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #1B1931;
      background: linear-gradient(135deg, #ED9E5B 0%, #F0AE72 100%);
      border: 1px solid var(--accent-deep);
      padding: 0.34rem 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      line-height: 1;
      min-height: 1.7rem;
      box-shadow: 0 0 28px rgba(237, 158, 91, 0.45);
    }

    .brand-eyebrow .dot {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      background: #1B1931;
      box-shadow: 0 0 0 3px rgba(27, 25, 49, 0.2);
      flex-shrink: 0;
      animation: pulseDot 2.2s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 6.5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin: 0 0 0.55rem;
      color: #F7EDE9;
      text-shadow: 0 0 48px rgba(237, 158, 91, 0.35);
    }

    h1 .edia {
      background: linear-gradient(120deg, #ED9E5B 0%, #F0AE72 45%, #E9BCB9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
    }

    .tagline {
      margin: 0;
      color: #E9BCB9;
      font-size: 1.06rem;
      font-weight: 450;
      max-width: 34em;
      line-height: 1.5;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 0.95rem 0 1rem;
      background: linear-gradient(
        180deg,
        rgba(27, 25, 49, 0.97) 0%,
        rgba(27, 25, 49, 0.9) 70%,
        rgba(27, 25, 49, 0) 100%
      );
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      margin-bottom: 0.25rem;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 0.85rem;
    }

    .search-wrap input {
      width: 100%;
      padding: 0.95rem 1.15rem 0.95rem 2.9rem;
      border: 2px solid #ED9E5B;
      border-radius: 10px;
      background: #E9BCB9;
      font: inherit;
      font-size: 1rem;
      font-weight: 500;
      color: #1B1931;
      outline: none;
      box-shadow: 0 4px 20px rgba(237, 158, 91, 0.25), var(--shadow);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .search-wrap input:focus {
      border-color: #F0AE72;
      background: #F3D4D1;
      box-shadow: 0 0 0 3px rgba(237, 158, 91, 0.35), 0 0 32px rgba(237, 158, 91, 0.3);
    }

    .search-wrap input::placeholder { color: #662249; opacity: 0.85; }

    .search-icon {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.15rem;
      height: 1.15rem;
      color: #44174E;
      pointer-events: none;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.42rem;
      align-items: center;
    }

    .chip {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 2px solid #A34054;
      background: #E9BCB9;
      color: #1B1931;
      font-family: var(--font-ui);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.15;
      padding: 0.5rem 0.92rem;
      min-height: 2.15rem;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.14s, border-color 0.14s, color 0.14s, transform 0.12s, box-shadow 0.14s;
      box-shadow: 0 2px 10px rgba(12, 8, 24, 0.25);
    }

    .chip:hover {
      border-color: #ED9E5B;
      color: #1B1931;
      background: #F3D4D1;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(237, 158, 91, 0.3);
    }

    .chip:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 2px;
    }

    .chip[aria-pressed="true"] {
      background: linear-gradient(135deg, #ED9E5B 0%, #F0AE72 100%);
      border-color: #D8893F;
      color: #1B1931;
      box-shadow: 0 0 0 1px rgba(237,158,91,0.5), 0 4px 22px var(--accent-glow);
      font-weight: 800;
    }

    .chip[aria-pressed="true"]:hover {
      background: linear-gradient(135deg, #F0AE72 0%, #ED9E5B 100%);
      transform: translateY(-1px);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      margin: 0.15rem 0 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #E9BCB9;
      font-family: var(--font-ui);
      letter-spacing: 0.03em;
    }

    #feed {
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }

    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #E9BCB9;
      border: 2.5px solid #ED9E5B;
      border-radius: var(--radius);
      padding: 1.25rem 1.35rem 1.15rem;
      box-shadow: 0 6px 24px rgba(12, 8, 24, 0.4), 0 0 0 1px rgba(237,158,91,0.15);
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s, background 0.18s;
      position: relative;
      overflow: hidden;
      animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    a.card:nth-child(1) { animation-delay: 0.02s; }
    a.card:nth-child(2) { animation-delay: 0.05s; }
    a.card:nth-child(3) { animation-delay: 0.08s; }
    a.card:nth-child(4) { animation-delay: 0.11s; }
    a.card:nth-child(5) { animation-delay: 0.14s; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    a.card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(180deg, #ED9E5B 0%, #A34054 100%);
      opacity: 1;
      border-radius: 3px 0 0 3px;
      box-shadow: 0 0 14px rgba(237, 158, 91, 0.55);
    }

    a.card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 100% 0%, rgba(237,158,91,0.22), transparent 55%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    a.card:hover {
      border-color: #F0AE72;
      background: #F0C8C4;
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    a.card:hover::after { opacity: 1; }
    a.card:hover::before { width: 6px; box-shadow: 0 0 20px rgba(237, 158, 91, 0.7); }

    a.card:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0 0 0.7rem;
      padding-left: 0.45rem;
    }

    .card-tags .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.28rem 0.55rem;
      border-radius: 4px;
      line-height: 1.15;
      min-height: 1.45rem;
      border: 1.5px solid transparent;
    }

    /* High-contrast tags on cream cards */
    .tag-tools { background: #ED9E5B; color: #1B1931; border-color: #D8893F; }
    .tag-people { background: #44174E; color: #E9BCB9; border-color: #1B1931; }
    .tag-autism { background: #A34054; color: #F7EDE9; border-color: #662249; }
    .tag-research { background: #662249; color: #E9BCB9; border-color: #44174E; }
    .tag-broader { background: #1B1931; color: #ED9E5B; border-color: #ED9E5B; }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.16rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.28;
      margin: 0 0 0.4rem;
      color: #1B1931;
      padding-left: 0.45rem;
    }

    .card-summary {
      margin: 0;
      font-size: 0.94rem;
      color: #44174E;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      padding-left: 0.45rem;
      line-height: 1.52;
      font-weight: 500;
    }

    .card-original {
      margin: 0.55rem 0 0;
      font-size: 0.74rem;
      font-weight: 500;
      color: #662249;
      line-height: 1.35;
      opacity: 0.95;
      padding-left: 0.45rem;
    }

    .card-foot {
      display: block;
      margin-top: 0.85rem;
      font-size: 0.78rem;
      padding-left: 0.45rem;
      font-family: var(--font-ui);
      letter-spacing: 0.01em;
    }

    .card-foot .people,
    .card-foot .region {
      display: inline;
      padding: 0;
      border-radius: 0;
      font-weight: 600;
      line-height: 1.4;
      max-width: 100%;
      text-align: left;
      border: none;
      background: none;
      cursor: inherit;
      text-decoration: none;
    }

    .card-foot .people {
      color: #A34054;
      opacity: 1;
    }

    .card-foot .region {
      color: #662249;
    }

    .card-foot .people + .region::before {
      content: "·";
      margin: 0 0.45rem 0 0.15rem;
      color: #A34054;
      font-weight: 400;
    }

    .empty {
      text-align: center;
      padding: 2.75rem 1.25rem;
      color: #1B1931;
      font-size: 1rem;
      background: #E9BCB9;
      border: 2px dashed #ED9E5B;
      border-radius: var(--radius);
      font-family: var(--font-ui);
      font-weight: 600;
    }

    footer {
      margin-top: 2.85rem;
      padding-top: 1.4rem;
      border-top: 2px solid rgba(237, 158, 91, 0.45);
      font-size: 0.8rem;
      color: #E9BCB9;
      text-align: center;
      font-family: var(--font-ui);
    }

    @media (max-width: 520px) {
      .wrap { padding: 1.35rem 0.95rem 3rem; }
      .brand-block { gap: 0.75rem; }
      .logo-mark { width: 54px; height: 54px; }
      h1 { font-size: 1.95rem; }
      .tagline { font-size: 0.98rem; }
      a.card { padding: 1.05rem 1.1rem 1rem; border-radius: var(--radius-sm); }
      .card-title { font-size: 1.06rem; }
      .chip {
        font-size: 0.76rem;
        padding: 0.44rem 0.78rem;
        min-height: 2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      a.card, .chip, header, .brand-eyebrow .dot { animation: none !important; transition: none; }
      a.card:hover, .chip:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand-block">
        <svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SLP'edia mark">
          <defs>
            <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#44174E"/>
              <stop offset="100%" stop-color="#1B1931"/>
            </linearGradient>
            <linearGradient id="bookL" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F0AE72"/>
              <stop offset="100%" stop-color="#ED9E5B"/>
            </linearGradient>
            <linearGradient id="bookR" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#E9BCB9"/>
              <stop offset="100%" stop-color="#A34054"/>
            </linearGradient>
            <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F5C9A0"/>
              <stop offset="100%" stop-color="#ED9E5B"/>
            </linearGradient>
            <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="1.8" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect x="2" y="8" width="60" height="48" rx="14" fill="url(#panel)" stroke="rgba(237,158,91,0.5)" stroke-width="1.5"/>
          <path d="M32 14v36" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
          <path d="M32 16c-9-1.6-18 0.2-22 4v27.5c4.5-3.2 13-5 22-3.4V16z" fill="url(#bookL)" opacity="0.95"/>
          <path d="M32 16c9-1.6 18 0.2 22 4v27.5c-4.5-3.2-13-5-22-3.4V16z" fill="url(#bookR)" opacity="0.9"/>
          <circle cx="47" cy="19" r="11.5" fill="url(#orb)" filter="url(#glow)" stroke="#D8893F" stroke-width="1.1"/>
          <circle cx="47" cy="19" r="4" fill="#1B1931" opacity="0.9"/>
          <circle cx="47" cy="19" r="1.8" fill="#ED9E5B"/>
        </svg>
        <div class="brand-text">
          <div class="brand-eyebrow"><span class="dot" aria-hidden="true"></span> Living encyclopedia</div>
          <h1>SLP<span class="edia">'edia</span></h1>
        </div>
      </div>
      <p class="tagline">A living encyclopedia of speech-language people, tools, and research — especially for autistic children.</p>
    </header>

    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="search" type="search" placeholder="Search titles, people, places…" autocomplete="off" />
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filters"></div>
    </div>

    <div class="meta-row">
      <span id="count"></span>
    </div>

    <div id="feed"></div>
    <div id="empty" class="empty" hidden>No cards match. Try another filter or clear search.</div>

    <footer>
      <span id="last-checked"></span>
    </footer>
  </div>

  <script>
    const FILTER_LABELS = {
      all: "All",
      people: "People",
      autism: "Autism & kids",
      tools: "Tools",
      research: "Research",
      broader: "Broader SLP",
    };
    const FILTER_ORDER = ["all", "people", "autism", "tools", "research", "broader"];
    const TAG_CLASS = {
      "Tools": "tag-tools",
      "People": "tag-people",
      "Autism & kids": "tag-autism",
      "Research": "tag-research",
      "Broader SLP": "tag-broader",
    };

    let data = null;
    let activeFilter = "all";
    let query = "";

    async function init() {
      const res = await fetch("./data.json");
      data = await res.json();
      renderChips();
      render();
      document.getElementById("search").addEventListener("input", (e) => {
        query = e.target.value.trim().toLowerCase();
        render();
      });
      const lc = data.lastChecked;
      if (lc) {
        document.getElementById("last-checked").textContent =
          "Sources last checked " + lc;
      }
    }

    function renderChips() {
      const el = document.getElementById("chips");
      el.innerHTML = "";
      FILTER_ORDER.forEach((key) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = FILTER_LABELS[key];
        btn.setAttribute("aria-pressed", key === activeFilter ? "true" : "false");
        btn.addEventListener("click", () => {
          activeFilter = key;
          [...el.children].forEach((c) =>
            c.setAttribute("aria-pressed", c === btn ? "true" : "false")
          );
          render();
        });
        el.appendChild(btn);
      });
    }

    function matches(card) {
      if (activeFilter !== "all") {
        const keys = card.filterKeys || [];
        if (!keys.includes(activeFilter)) return false;
      }
      if (!query) return true;
      const hay = [
        card.title,
        card.titleOriginal,
        card.summary,
        card.people,
        card.region,
        ...(card.filters || []),
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
      return hay.includes(query);
    }

    function render() {
      const cards = (data.cards || []).filter(matches);
      const feed = document.getElementById("feed");
      const empty = document.getElementById("empty");
      feed.innerHTML = "";
      cards.forEach((card) => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = card.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        if (card.filters && card.filters.length) {
          const tags = document.createElement("div");
          tags.className = "card-tags";
          card.filters.forEach((f) => {
            const t = document.createElement("span");
            t.className = "tag " + (TAG_CLASS[f] || "tag-broader");
            t.textContent = f;
            tags.appendChild(t);
          });
          a.appendChild(tags);
        }

        const title = document.createElement("h2");
        title.className = "card-title";
        title.textContent = card.title;

        const summary = document.createElement("p");
        summary.className = "card-summary";
        summary.textContent = card.summary || "";

        const foot = document.createElement("div");
        foot.className = "card-foot";
        if (card.people) {
          const p = document.createElement("span");
          p.className = "people";
          p.textContent = card.people;
          foot.appendChild(p);
        }
        if (card.region) {
          const r = document.createElement("span");
          r.className = "region";
          r.textContent = card.region;
          foot.appendChild(r);
        }

        a.appendChild(title);
        a.appendChild(summary);
        if (foot.childNodes.length) a.appendChild(foot);

        if (card.titleOriginal) {
          const orig = document.createElement("p");
          orig.className = "card-original";
          orig.textContent = "Original: " + card.titleOriginal;
          a.appendChild(orig);
        }
        feed.appendChild(a);
      });

      empty.hidden = cards.length > 0;
      const total = (data.cards || []).length;
      const label =
        cards.length === total
          ? total + " cards"
          : cards.length + " of " + total + " cards";
      document.getElementById("count").textContent = label;
    }

    init();
  </script>
</body>
</html>
